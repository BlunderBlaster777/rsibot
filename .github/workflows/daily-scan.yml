name: Daily RSI scan

on:
  schedule:
    # 00:17 UTC, just after the daily candle closes.
    - cron: "17 0 * * *"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      # 300 coins keeps a daily run inside the free Demo key's 10,000 calls/month.
      - run: python rsi_scanner.py --max-coins 300 --email --csv signals.csv
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: aj.ryder@outlook.com
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signals
          path: signals.csv
          if-no-files-found: ignore
